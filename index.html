<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Candlelight - Velas Artesanais</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="./assets/css/style.css">
  </head>

  <body>
    <div id="navbar"></div>
    <main id="conteudo">
    </main>

    <footer class="bg-success text-white py-4 mt-5">
        <div class="container">
            <div class="row text-center text-md-start">
            <div class="col-md-4 mb-3">
                <h5>Candle Light</h5>
                <p>Velas artesanais feitas com carinho e propósito.</p>
            </div>

            <div class="col-md-4 mb-3">
                <h5>Contato</h5>
                <p>Email: contato@candlelight.com</p>
                <p>WhatsApp: (00) 91234-5678</p>
            </div>
           
            <div class="col-md-4 mb-3">
                <h5>Redes Sociais</h5>
                <a href="#" class="text-white text-decoration-none d-block">Instagram</a>
                <a href="#" class="text-white text-decoration-none d-block">Facebook</a>
            </div>
            </div>

            <hr class="border-light">

            <div class="text-center small">
            © 2025 Candle Light. Todos os direitos reservados.
            </div>
        </div>

        <button class="btn btn-outline-success bg-white position-fixed bottom-0 end-0 m-4 rounded-circle p-4 shadow" style="z-index: 9999;" data-bs-toggle="modal" data-bs-target="#modalChat" title="Fale conosco">
            <i class="fas fa-comments fa-lg"></i>
        </button>

        <div class="modal fade" id="modalChat" tabindex="-1" aria-labelledby="modalChatLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title text-black" id="modalChatLabel">Atendimento</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                    </div>

                    <div class="modal-body text-black">
                        <p>Olá! Como podemos te ajudar?</p>
                        <textarea class="form-control" placeholder="Escreva sua mensagem..." rows="3"></textarea>
                    </div> 

                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                        <button type="button" class="btn btn-success" disabled>Enviar</button>
                    </div>
                </div>
            </div>
        </div>

    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./assets/js/detalhes.js"></script> 
    <script src="./assets/js/main.js"></script>
    <script src="./assets/js/produtos.js"></script>    
  </body>
</html>
