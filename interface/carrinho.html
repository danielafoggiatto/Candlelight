<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Carrinho de Compras</title>
   
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/carrinho.css">
</head>

<body>
  
  <div class="container">
    <div class="card p-4 shadow">
      <h1 class="mb-4 text-center">Meu Carrinho de Compras 🛒</h1>

      <div class="table-responsive">
        <table class="table align-middle">
          <thead class="table-success">
            <tr>
              <th scope="col">Produto</th>
              <th scope="col">Preço</th>
              <th scope="col">Quantidade</th>
              <th scope="col">Subtotal</th>
              <th scope="col">Remover</th>
            </tr>
          </thead>
          <tbody id="tabela-carrinho">
            <!-- Itens via JS -->
          </tbody>
        </table>
      </div>

      <div class="d-flex justify-content-end mt-3">
        <div id="total">Total: R$ 0,00</div>
      </div>
      <button id="btn-voltar" class="btn btn-outline-success my-4">
        ← Voltar
    </button>

    </div>
  </div>

  <div id="desfazer-container" style="
  position: fixed;
  bottom: 80px;
  right: 20px;
  display: none;
  z-index: 1000;
  ">
      <button id="btn-desfazer" class="btn btn-danger text-white fw-semibold shadow">
  🔄 Desfazer remoção
      </button>
    </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/carrinho.js"></script>
  <script src="../assets/js/produtos.js"></script>
  <script src="../assets/js/main.js"></script>
</body>
</html>
